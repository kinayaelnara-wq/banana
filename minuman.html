<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Minuman - Bu Nana</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <header>
        <h1>Lotek & Kupat Tahu Bu Nana</h1>
        <p>Silakan pilih minuman favorit kamu!</p>
        <h3 id="infoMeja">Nomor Meja: -</h3>
        <nav>
            <a href="index.html">Menu Makanan</a>
            <a href="minuman.html">Menu Minuman</a>
        </nav>
    </header>

    <main class="container">
        <h2>Menu Minuman</h2>
        <div class="menu" id="menuMinuman"></div>

        <section id="keranjang">
            <h2>Pesanan Kamu</h2>
            <div id="daftarPesanan">Belum ada pesanan.</div>
            <p>Total: <strong id="total">Rp0</strong></p>

            <button onclick="kosongkanKeranjang()">
                Kosongkan Pesanan
            </button>

            <div style="margin-top:15px; text-align:left;">
                <label for="catatanPesanan"><b>Catatan Pesanan:</b></label>
                <textarea id="catatanPesanan"
                    placeholder="Contoh: Es sedikit..."
                    style="width:100%; height:60px; margin-top:5px;">
                </textarea>
            </div>

            <button onclick="kirimKeWhatsApp()"
                style="background-color:#25D366; color:white; padding:12px; width:100%; margin-top:10px;">
                Kirim Pesanan ke WhatsApp
            </button>
        </section>
    </main>

    <footer>
        <p>Terima kasih sudah berkunjung ke Bu Nana!</p>
    </footer>

    <script src="script.js?v=2"></script>
</body>
</html>
